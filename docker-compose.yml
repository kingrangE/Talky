services:
  app:
    image: talky-app:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      OLLAMA_BASE_URL: http://ollama:11434
      NEO4J_URI: bolt://neo4j:7687
      AUDIO_CACHE_DIR: /cache
      MOCK_EXAM_DATA_DIR: /app/.data/mock-exam
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - whisper-cache:/cache/whisper
      - tts-cache:/cache/tts
      - mock-exam-data:/app/.data/mock-exam
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    image: talky-app:local
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.mock_exam.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      OLLAMA_BASE_URL: http://ollama:11434
      NEO4J_URI: bolt://neo4j:7687
      AUDIO_CACHE_DIR: /cache
      MOCK_EXAM_DATA_DIR: /app/.data/mock-exam
    volumes:
      - whisper-cache:/cache/whisper
      - tts-cache:/cache/tts
      - mock-exam-data:/app/.data/mock-exam
    depends_on:
      app:
        condition: service_healthy

  graph-worker:
    image: talky-app:local
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.graph_db.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      app:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    environment:
      MODEL_NAME: ${MODEL_NAME:-skt/A.X-4.0-Light}
    volumes:
      - ollama-data:/root/.ollama
      - ./Modelfile:/work/Modelfile:ro
      - ./model:/work/model:ro
      - ./docker/ollama-init.sh:/ollama-init.sh:ro
    entrypoint: ["/bin/bash", "/ollama-init.sh"]
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$${MODEL_NAME}\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talky}
      POSTGRES_USER: ${POSTGRES_USER:-talky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talky}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talky} -d ${POSTGRES_DB:-talky}"]
      interval: 5s
      timeout: 3s
      retries: 30

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-talky-dev-pw}
    volumes:
      - neo4j-data:/data
      - ./docker/neo4j-init.cypher:/init.cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  ollama-data:
  pg-data:
  neo4j-data:
  whisper-cache:
  tts-cache:
  mock-exam-data:
